[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
lib_deps =
    fastled/FastLED
    tzapu/WiFiManager
    cnmat/OSC
    bblanchon/ArduinoJson
board_build.filesystem = littlefs
