; Shared config
[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
lib_deps =
    fastled/FastLED
    tzapu/WiFiManager
    cnmat/OSC
    bblanchon/ArduinoJson
    forkineye/ESPAsyncE131
board_build.filesystem = littlefs

; Generic ESP-WROOM-32 dev board (USB-serial, WiFi only)
[env:esp32dev]
board = esp32dev
build_flags =
    -DBOARD_GENERIC_ESP32
    -DDEFAULT_LED_PIN=2

; WT32-ETH01 (classic ESP32 + LAN8720 RMII Ethernet, external USB-TTL)
[env:wt32-eth01]
board = wt32-eth01
upload_speed = 115200
upload_resetmethod = no_reset
build_flags =
    -DBOARD_WT32_ETH01
    -DDEFAULT_LED_PIN=4

; ESP32-S3 + W5500 Ethernet board (native USB-C, POE)
; e.g. Waveshare ESP32-S3-ETH / Amazon B0DKXFB7PW
[env:esp32-s3-eth]
board = esp32-s3-devkitc-1
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
build_flags =
    -DBOARD_ESP32_S3_ETH
    -DDEFAULT_LED_PIN=33
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
