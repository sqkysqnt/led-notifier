; Shared config
[env]
platform = espressif32@~6.8.1
framework = arduino
monitor_speed = 115200
upload_port = /dev/cu.usbserial-0001
monitor_port = /dev/cu.usbserial-0001
lib_deps =
    fastled/FastLED
    tzapu/WiFiManager
    cnmat/OSC
    bblanchon/ArduinoJson
    forkineye/ESPAsyncE131
board_build.filesystem = littlefs

; Generic ESP-WROOM-32 dev board (USB-serial, WiFi only)
[env:esp32dev]
board = esp32dev
build_flags =
    -DBOARD_GENERIC_ESP32
    -DDEFAULT_LED_PIN=2

; WT32-ETH01 (classic ESP32 + LAN8720 RMII Ethernet, external USB-TTL)
[env:wt32-eth01]
board = wt32-eth01
upload_speed = 115200
upload_resetmethod = no_reset
build_flags =
    -DBOARD_WT32_ETH01
    -DDEFAULT_LED_PIN=4

; ESP32-S3 + W5500 Ethernet board (native USB-C, POE)
; e.g. Waveshare ESP32-S3-ETH / Amazon B0DKXFB7PW
; Stays on Arduino ESP32 core 2.x; adds W5500 SPI support via khoih-prog's
; library which extends the standard ETH class. Ethernet tried first, WiFi
; falls back automatically.
[env:esp32-s3-eth]
board = esp32-s3-devkitc-1
upload_speed = 115200
upload_port = /dev/cu.usbmodem*
monitor_port = /dev/cu.usbmodem*
lib_deps =
    ${env.lib_deps}
    khoih-prog/WebServer_ESP32_SC_W5500@^1.2.1
build_flags =
    -DBOARD_ESP32_S3_ETH
    -DDEFAULT_LED_PIN=33
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    ; W5500 SPI pin mapping for Waveshare ESP32-S3-ETH
    -DWS_W5500_MISO_GPIO=12
    -DWS_W5500_MOSI_GPIO=11
    -DWS_W5500_SCK_GPIO=13
    -DWS_W5500_CS_GPIO=14
    -DWS_W5500_INT_GPIO=10
    -DWS_W5500_RST_GPIO=9
    -DWS_W5500_SPI_CLOCK_MHZ=25
